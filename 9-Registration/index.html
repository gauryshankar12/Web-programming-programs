
<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Registration Form</h1>

    <div class="container">

        <form id="registerForm">

            <input type="text" id="name" placeholder="Enter Name">
            <p id="nameError" class="error"></p>

            <input type="text" id="regEmail" placeholder="Enter Email">
            <p id="regEmailError" class="error"></p>

            <input type="password" id="regPassword" placeholder="Enter Password">
            <p id="regPasswordError" class="error"></p>

            <button type="submit">Register</button>

        </form>

    </div>


    <h1>Login Form</h1>

    <div class="container">

        <form id="loginForm">

            <input type="text" id="loginEmail" placeholder="Enter Email">
            <p id="loginEmailError" class="error"></p>

            <input type="password" id="loginPassword" placeholder="Enter Password">
            <p id="loginPasswordError" class="error"></p>

            <button type="submit">Login</button>

        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
